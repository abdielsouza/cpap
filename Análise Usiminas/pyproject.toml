[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "usiminas-analysis"
version = "0.1.0"
description = "Projeto de análise de dados da Usiminas a partir da base trimestral 2T26"
requires-python = ">=3.10"
dependencies = ["pandas>=2.2", "numpy>=2.0", "openpyxl>=3.1", "matplotlib>=3.9", "streamlit>=1.40"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
